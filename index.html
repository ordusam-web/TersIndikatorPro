<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ters İndikatör Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            husranSiyahi: '#121212',
            krizKirmizisi: '#CC0000',
            haberMavisi: '#003366',
            tersineYesil: '#39FF14',
            ikazSarisi: '#FFCC00',
          },
          animation: {
            'ticker': 'ticker 15s linear infinite',
            'flash': 'flash 1s infinite',
          },
          keyframes: {
            ticker: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(-100%)' }
            },
            flash: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.5 },
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #121212; color: white; margin: 0; padding: 0; overflow-x: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Dashboard() {
      const [action, setAction] = useState('');
      const [status, setStatus] = useState('idle');
      const [news, setNews] = useState(null);

      // Kelime analizine göre global haber üreteci
      const generateNews = (text) => {
        const lowerText = text.toLowerCase();
        
        if (lowerText.includes('altın') || lowerText.includes('dolar') || lowerText.includes('borsa')) {
          return {
            source: 'GLOBAL FİNANS BÜLTENİ',
            headline: 'KÜRESEL PİYASALARDA ŞOK DALGASI!',
            body: 'Sen işlem yaptığın an Wall Street acil toplandı. Piyasadan saniyeler içinde 50 milyar dolar silindi. Uzmanlar bu çöküşe "Bahtsızlık Etkisi" adını verdi.',
            ticker: 'ALTIN %40 DEĞER KAYBETTİ • YATIRIMCILAR SOKAKLARA DÖKÜLDÜ • MERKEZ BANKASI BAŞKANI İSTİFA ETTİ •'
          };
        }
        if (lowerText.includes('telefon') || lowerText.includes('tablet')) {
          return {
            source: 'TEKNOLOJİ RADARI',
            headline: 'GÜNEY KORE BORSASINDA PANİK!',
            body: 'Senin yeni cihazı kutusundan çıkardığın an, şirketin hisseleri %40 çakıldı. Cihazın kronik ısınma sorunlu seriden olduğu ortaya çıktı, şarjı şu an gözünün önünde %10\'a düştü.',
            ticker: 'YENİ MODELDE KRONİK HATA TESPİT EDİLDİ • SİLİKON VADİSİ ACİL DURUM İLAN ETTİ • MÜŞTERİ HİZMETLERİ TELEFONLARI FİŞTEN ÇEKTİ •'
          };
        }
        if (lowerText.includes('at') || lowerText.includes('yarış') || lowerText.includes('kupon') || lowerText.includes('altılı')) {
          return {
            source: 'TJK DİSİPLİN KURULU ACİL BİLDİRİSİ',
            headline: 'HİPODROMDA TARİHİ SKANDAL!',
            body: 'Banko dediğin ve uzak ara önde giden o at, son 10 metrede aniden durup kenardaki çimenleri yemeye başladı. Jokey şokta, tribünler buz kesti. Tüm kuponlar çöp oldu.',
            ticker: 'FAVORİ AT YARIŞI BIRAKTI • HAKEM HEYETİ İNCELEME BAŞLATTI • BÜLTENLER YENİDEN YAZILIYOR •'
          };
        }
        if (lowerText.includes('yaban mersini') || lowerText.includes('fidan') || lowerText.includes('bitki')) {
          return {
            source: 'ZİRAAT ODASI ALARMI',
            headline: 'BİTKİ ÖRTÜSÜ TEHLİKEDE!',
            body: 'Fidana can suyunu verdiğin an bitki kahverengiye dönüp çıtırdayarak kurudu. Yaprakları şiddetle kıvrıldı ve saksıdaki toprak bile kararına isyan edip taşlaştı.',
            ticker: 'BÖLGEDE TARIMSAL FAALİYETLER DURDURULDU • BOTANİK UZMANLARI ÇARESİZ •'
          };
        }
        if (lowerText.includes('araba') || lowerText.includes('yıkama') || lowerText.includes('araç')) {
          return {
            source: 'METEOROLOJİ GENEL MÜDÜRLÜĞÜ',
            headline: 'KIZIL ALARM: ÇAMUR YAĞIŞI!',
            body: 'Arabayı yıkamaya karar verdiğin an gökyüzü karardı. Yıkamadan çıktığın gibi bölgeye çamur yağdı. Üstüne bir de aracın yeni kasası yarı fiyatına duyuruldu.',
            ticker: 'BÖLGESEL HORTUM BEKLENİYOR • OTO YIKAMACILAR KEPENK İNDİRDİ •'
          };
        }
        
        return {
          source: 'DÜNYA SAĞLIK VE KRİZ ÖRGÜTÜ',
          headline: 'KELEBEK ETKİSİ KONTROLDEN ÇIKTI!',
          body: 'Bu inanılmaz kararınla küresel bir kaosu başlattın. Tercihin sana %100 zarar, bolca stres ve sisteme 500 Bahtsızlık Puanı olarak geri döndü.',
          ticker: 'HİÇBİR ŞEYE DOKUNMA • SADECE BEKLE • EKONOMİSTLER ÇÖZÜM ARIYOR •'
        };
      };

      const handleAlert = () => {
        if (action.trim() === '') return;
        setStatus('loading');
        setTimeout(() => {
          setNews(generateNews(action));
          setStatus('result');
        }, 2500);
      };

      return (
        <div className="flex flex-col items-center justify-center space-y-8 mt-6">
          {status === 'idle' && (
            <React.Fragment>
              <div className="text-center">
                <h2 className="text-2xl font-bold mb-2">Bugün Neyi Batırıyoruz?</h2>
                <p className="text-gray-400 text-sm">Altın mı, telefon mu, at yarışı mı? Yaz ve izle.</p>
              </div>
              <textarea
                rows="3"
                placeholder="Örn: Telefonumu satıp yenisini alacağım..."
                value={action}
                onChange={(e) => setAction(e.target.value)}
                className="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg p-4 text-white focus:outline-none focus:border-ikazSarisi resize-none"
              />
              <button
                onClick={handleAlert}
                className="w-48 h-48 rounded-full bg-krizKirmizisi border-8 border-ikazSarisi flex items-center justify-center shadow-[0_0_50px_rgba(204,0,0,0.6)] active:scale-95 transition-transform"
              >
                <span className="text-xl font-bold text-white text-center tracking-wider">PİYASAYI<br/>UYAR</span>
              </button>
            </React.Fragment>
          )}

          {status === 'loading' && (
            <div className="flex flex-col items-center justify-center space-y-6 mt-12">
              <div className="w-24 h-24 border-8 border-t-ikazSarisi border-gray-700 rounded-full animate-spin"></div>
              <p className="text-2xl font-black text-krizKirmizisi animate-pulse">SİNYAL DÜNYAYA YAYILIYOR...</p>
              <p className="text-gray-400 text-center">Haber ajansları son dakika geçiyor, lütfen bekle.</p>
            </div>
          )}

          {status === 'result' && news && (
            <div className="w-full mt-2 animate-fade-in-up">
              {/* TV Haber Ekranı Tasarımı */}
              <div className="bg-haberMavisi rounded-t-xl overflow-hidden shadow-2xl border-2 border-gray-800 relative">
                
                {/* Canlı Yayın İkonu */}
                <div className="absolute top-4 right-4 flex items-center space-x-2 bg-black bg-opacity-50 px-3 py-1 rounded-full">
                  <div className="w-3 h-3 bg-red-500 rounded-full animate-flash"></div>
                  <span className="text-white font-bold text-xs">CANLI</span>
                </div>

                <div className="p-6 pb-8">
                  <p className="text-ikazSarisi font-bold text-sm tracking-widest mb-1">{news.source}</p>
                  <h3 className="text-3xl font-black text-white uppercase leading-tight mb-4 drop-shadow-md">
                    {news.headline}
                  </h3>
                  <div className="bg-black bg-opacity-40 p-4 rounded-lg border-l-4 border-krizKirmizisi">
                    <p className="text-gray-300 font-medium text-lg leading-relaxed">
                      {news.body}
                    </p>
                  </div>
                </div>

                {/* Alt Kayan Yazı (Ticker) */}
                <div className="bg-krizKirmizisi flex items-center overflow-hidden h-12 relative border-t-4 border-white">
                  <div className="bg-white text-krizKirmizisi font-black px-4 py-3 h-full flex items-center z-10 shadow-lg">
                    SON DAKİKA
                  </div>
                  <div className="flex-1 whitespace-nowrap overflow-hidden relative">
                    <div className="animate-ticker inline-block text-white font-bold tracking-widest pl-4">
                      {news.ticker} {news.ticker} {news.ticker}
                    </div>
                  </div>
                </div>
              </div>
              
              <button
                onClick={() => { setAction(''); setStatus('idle'); }}
                className="w-full mt-6 py-4 bg-[#1a1a1a] border border-gray-700 text-gray-300 font-bold rounded-lg hover:border-tersineYesil hover:text-tersineYesil transition-colors"
              >
                🔄 Yayını Kapat ve Yeni Bir Hata Yap
              </button>
            </div>
          )}
        </div>
      );
    }

    // AntiTerazi ve Karantina komponentleri aynı (Yer tasarrufu için özet geçiyorum, kopyalarken üstteki kodla aynı kalacak)
    function AntiTerazi() { return (<div className="p-8 text-center"><h2 className="text-xl font-bold">Anti-Terazi Bakımda</h2></div>); }
    function Karantina() { return (<div className="p-8 text-center"><h2 className="text-xl font-bold">Karantina Havuzu Bakımda</h2></div>); }

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      return (
        <div className="min-h-screen bg-husranSiyahi text-white font-sans selection:bg-krizKirmizisi">
          <header className="p-4 border-b border-gray-800 flex justify-between items-center bg-black">
            <h1 className="text-xl font-black text-ikazSarisi">TERS İNDİKATÖR PRO</h1>
            <div className="text-right">
              <p className="text-xs text-gray-400">Bahtsızlık Skoru</p>
              <p className="text-krizKirmizisi font-bold">9.450 Puan</p>
            </div>
          </header>
          <main className="p-4 pb-24 h-full">
            {activeTab === 'dashboard' && <Dashboard />}
          </main>
          <nav className="fixed bottom-0 w-full bg-[#0a0a0a] border-t border-gray-800 flex justify-around p-4 z-50">
            <button onClick={() => setActiveTab('dashboard')} className={`${activeTab === 'dashboard' ? 'text-ikazSarisi' : 'text-gray-500'} font-bold`}>🚨 Radar</button>
          </nav>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
